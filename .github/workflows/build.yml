name: APK bauen

on:
  push:
  workflow_dispatch:
  # Hält den zwischengespeicherten Signaturschlüssel am Leben
  # (GitHub löscht Caches, die 7 Tage nicht benutzt wurden).
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gleicher Schlüssel für jeden Build, sonst lässt sich ein Update nicht
      # über die installierte Version installieren. Der Schlüssel wird einmal
      # angelegt und liegt danach im GitHub-Cache (nicht im Repo).
      - name: Signaturschlüssel aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/glut-signing
          key: glut-signing-v2

      - name: Nur Cache auffrischen (geplanter Lauf)
        if: github.event_name == 'schedule'
        run: |
          test -f ~/glut-signing/sideload.jks && echo "Schlüssel vorhanden." || echo "::warning::Schlüssel fehlt im Cache."

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'

      # Ein eigener Schlüssel aus den Secrets hat Vorrang. Sonst der Cache-Schlüssel
      # mit den üblichen, öffentlichen Debug-Zugangsdaten ("android").
      - name: Signaturschlüssel bereitstellen
        if: github.event_name != 'schedule'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else
            mkdir -p ~/glut-signing
            if [ ! -f ~/glut-signing/sideload.jks ]; then
              keytool -genkeypair -keystore ~/glut-signing/sideload.jks -storetype JKS \
                -alias androiddebugkey -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "SIGNING_STORE_FILE=$HOME/glut-signing/sideload.jks" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        if: github.event_name != 'schedule'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'android' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: glut-launcher-apk
          path: app/build/outputs/apk/debug/*.apk

      # Feste Download-Adresse für die Downloader-App auf dem Fire TV:
      # https://github.com/ENjxzlt/Sanity/releases/latest/download/glut-launcher.apk
      # Die Zeilen versionCode=/versionName= liest die Update-Funktion im Launcher.
      - name: Release aktualisieren
        if: github.event_name != 'schedule' && github.ref == 'refs/heads/ccr-579bb9e7-stpfdp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk glut-launcher.apk
          gh release delete neuester-build --yes --cleanup-tag || true
          gh release create neuester-build glut-launcher.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Glut Launcher 0.2.$GITHUB_RUN_NUMBER" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation: siehe README.

          versionCode=$GITHUB_RUN_NUMBER
          versionName=0.2.$GITHUB_RUN_NUMBER"
