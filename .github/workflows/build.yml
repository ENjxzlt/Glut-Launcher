name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel aus Secret holen (optional)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else
            echo "Kein Secret gesetzt – APK wird mit zufälligem Debug-Schlüssel signiert."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: glut-launcher-apk
          path: app/build/outputs/apk/debug/*.apk

      # Feste Download-Adresse für die Downloader-App auf dem Fire TV:
      # https://github.com/ENjxzlt/Sanity/releases/latest/download/glut-launcher.apk
      - name: Release aktualisieren
        if: github.ref == 'refs/heads/ccr-579bb9e7-stpfdp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk glut-launcher.apk
          gh release delete neuester-build --yes --cleanup-tag || true
          gh release create neuester-build glut-launcher.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Glut Launcher – neuester Build" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Installation: siehe README."
