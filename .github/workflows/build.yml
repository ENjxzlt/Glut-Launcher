name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
  # Keeps the cached signing key alive (GitHub drops caches unused for 7 days).
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4

      # Every build must be signed with the same key, otherwise in-app updates
      # cannot install over the existing version. The key is created once and
      # then lives in the Actions cache (never in the repository).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/glut-signing
          key: glut-signing-v2

      - name: Touch cache only (scheduled run)
        if: github.event_name == 'schedule'
        run: |
          test -f ~/glut-signing/sideload.jks && echo "Key present." || echo "::warning::Signing key missing from cache."

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'

      # A key from repository secrets takes precedence. Otherwise the cached key
      # with the standard public debug credentials ("android") is used.
      - name: Provide signing key
        if: github.event_name != 'schedule'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else
            mkdir -p ~/glut-signing
            if [ ! -f ~/glut-signing/sideload.jks ]; then
              keytool -genkeypair -keystore ~/glut-signing/sideload.jks -storetype JKS \
                -alias androiddebugkey -storepass android -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "SIGNING_STORE_FILE=$HOME/glut-signing/sideload.jks" >> "$GITHUB_ENV"
          fi

      - name: Version name
        if: github.event_name != 'schedule'
        run: |
          if [ "$IS_TAG" = "true" ]; then
            echo "GLUT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "GLUT_VERSION_NAME=dev-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        if: github.event_name != 'schedule'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || 'android' }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk glut-launcher.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: glut-launcher-${{ env.GLUT_VERSION_NAME }}
          path: glut-launcher.apk

      # Beta channel: every push to the default branch replaces the
      # "neuester-build" pre-release. The in-app updater reads the
      # versionCode=/versionName= lines from the release notes.
      - name: Publish beta (pre-release)
        if: github.event_name != 'schedule' && env.IS_TAG != 'true' && (env.IS_DEFAULT_BRANCH == 'true' || github.ref == 'refs/heads/ccr-579bb9e7-stpfdp')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neuester-build --yes --cleanup-tag || true
          gh release create neuester-build glut-launcher.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Glut Launcher $GLUT_VERSION_NAME (beta)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Untested – for stable versions use the latest release.

          versionCode=$GITHUB_RUN_NUMBER
          versionName=$GLUT_VERSION_NAME"

      # Stable channel: a tag like v1.0.0 creates a regular release that
      # becomes "latest". Notes come from the matching CHANGELOG.md section.
      - name: Publish stable release
        if: github.event_name != 'schedule' && env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## [$GLUT_VERSION_NAME]" '
            index($0, v) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $GLUT_VERSION_NAME"
            exit 1
          fi
          printf '\n---\n\nversionCode=%s\nversionName=%s\n' "$GITHUB_RUN_NUMBER" "$GLUT_VERSION_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" glut-launcher.apk \
            --verify-tag \
            --latest \
            --title "Glut Launcher $GLUT_VERSION_NAME" \
            --notes-file notes.md
